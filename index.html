<title>Dashboard</title>
<style>
:root{
  --bg:#12141c; --side:#171a24; --card:#1d212d; --card-h:#232837; --line:#2a3040;
  --text:#eef0f6; --mute:#8b93a7; --accent:#7084ff; --accent-bg:rgba(112,132,255,.14);
  --up:#2ed3a0; --down:#ff6b7a; --warn:#f5b84b;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.sidebar{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font-weight:650;font-size:16px;letter-spacing:-.01em}
.brand i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#7084ff,#9b6bff)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;color:var(--mute);text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--card);color:var(--text)}
.nav button.active{background:var(--accent-bg);color:var(--accent)}
.nav .soon{margin-left:auto;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 6px}

.main{padding:calc(32px + env(safe-area-inset-top,0px)) clamp(16px,4vw,48px) 48px;min-width:0}
.page{max-width:720px;margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-size:22px;font-weight:650;letter-spacing:-.02em}

.total{background:linear-gradient(160deg,#242a3d,#1d212d);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:16px}
.total small{color:var(--mute)}
.total .sum{font-size:clamp(30px,6vw,40px);font-weight:700;letter-spacing:-.03em;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.total .row{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute)}

.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);transition:background .15s}
.btn:hover{background:var(--card-h)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:550}
.btn.primary:hover{background:#8394ff}
.btn[disabled]{opacity:.6;cursor:default}
.btn svg{width:16px;height:16px}
.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.upd{margin-left:auto;color:var(--mute);font-size:12px}

.banner{background:rgba(255,107,122,.1);border:1px solid rgba(255,107,122,.35);color:#ffb0b8;border-radius:12px;padding:10px 14px;margin-bottom:12px}

.list{display:flex;flex-direction:column;gap:8px}
.w{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid transparent;border-radius:16px;padding:14px 16px;transition:background .15s,border-color .15s}
.w:hover{background:var(--card-h);border-color:var(--line)}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.info{min-width:0;flex:1}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums;padding:1px 0;border-radius:6px}
.addr:hover{color:var(--text)}
.addr svg{width:13px;height:13px}
.val{text-align:right;font-variant-numeric:tabular-nums}
.bal{font-size:18px;font-weight:650;letter-spacing:-.01em}
.chg{font-size:12.5px;font-weight:550}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mute)}
.err{color:var(--warn);font-size:12.5px;text-align:right}
.err button{color:var(--accent);margin-left:6px;text-decoration:underline}
.sk{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line),#343b50,var(--line));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

.stub{text-align:center;padding:80px 20px;color:var(--mute)}
.stub svg{width:40px;height:40px;margin-bottom:12px;opacity:.6}
.stub h2{color:var(--text);font-size:18px;margin-bottom:6px}

@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:auto 0 0 0;height:auto;z-index:10;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .brand{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around;overflow-x:auto}
  .nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}
  .nav .soon{display:none}
  .main{padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .upd{width:100%;margin:0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>

const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function avatar(addr) {
  const h = parseInt(addr.slice(2, 10), 16), h2 = parseInt(addr.slice(10, 18), 16);
  const a = h % 360, b = (a + 40 + (h2 % 120)) % 360;
  return `<div class="av" style="background:linear-gradient(${h2 % 360}deg,hsl(${a} 70% 55%),hsl(${b} 75% 45%))">${addr.slice(2, 4).toUpperCase()}</div>`;
}

/* ============ Hyperliquid API ============ */
async function post(body, tries = 3) {
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (r.status === 429) { await sleep(900 * (i + 1)); continue; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) {
      if (i === tries - 1) throw e;
      await sleep(400 * (i + 1));
    }
  }
  throw new Error("Лимит запросов API");
}

async function fetchWallet(address) {
  const [st, pf] = await Promise.allSettled([
    post({ type: "clearinghouseState", user: address }),
    post({ type: "portfolio", user: address }),
  ]);
  if (st.status === "rejected") throw st.reason;
  let value = parseFloat(st.value?.marginSummary?.accountValue);
  let diff = null, pct = null;
  if (pf.status === "fulfilled") {
    const day = (pf.value || []).find(p => p[0] === "day")?.[1];
    const av = day?.accountValueHistory, pnl = day?.pnlHistory;
    if (av?.length) {
      const start = +av[0][1], end = +av[av.length - 1][1];
      if (isNaN(value)) value = end;
      // PnL-разница не учитывает вводы/выводы; если её нет — берём изменение баланса
      diff = pnl?.length > 1 ? +pnl[pnl.length - 1][1] - +pnl[0][1] : end - start;
      pct = start > 0 ? diff / start * 100 : null;
    }
  }
  if (isNaN(value)) throw new Error("Нет данных");
  return { value, diff, pct };
}

/* ============ Модуль «Wallets» ============ */
const Wallets = (() => {
  const items = WALLETS.map((w, i) => {
    const o = typeof w === "string" ? { address: w } : w;
    return { address: o.address, name: o.name || "Wallet " + (i + 1), idx: i, status: "idle" };
  });
  let sort = "desc", loading = false, updated = null, root = null, raf = 0;

  async function loadOne(it) {
    it.status = "loading"; paint();
    try { Object.assign(it, await fetchWallet(it.address), { status: "ok", error: null }); }
    catch (e) { it.status = "error"; it.error = e.message || "Ошибка"; }
    paint();
  }
  async function refresh() {
    if (loading) return;
    loading = true; items.forEach(i => { if (i.status !== "ok") i.status = "loading"; });
    paint();
    const queue = items.slice();
    await Promise.all(Array.from({ length: CONCURRENCY }, async () => {
      while (queue.length) await loadOne(queue.shift());
    }));
    loading = false; updated = new Date(); paint();
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && root?.isConnected && updated && Date.now() - updated > 60000) refresh();
  });
  function paint() { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }

  function sorted() {
    const a = items.slice();
    if (sort === "desc") a.sort((x, y) => (y.value ?? -1) - (x.value ?? -1));
    else if (sort === "asc") a.sort((x, y) => (x.value ?? Infinity) - (y.value ?? Infinity));
    return a;
  }
  const sortLabel = () => ({ desc: "Сначала большие", asc: "Сначала малые", none: "Как в списке" }[sort]);

  function card(it) {
    let right;
    if (it.status === "ok") {
      const cls = it.pct == null ? "flat" : it.pct > 0.005 ? "up" : it.pct < -0.005 ? "down" : "flat";
      const sign = it.pct > 0 ? "+" : "";
      right = `<div class="bal">${fmtUsd(it.value)}</div><div class="chg ${cls}">${it.pct == null ? "—" : sign + it.pct.toFixed(2) + "%"}</div>`;
    } else if (it.status === "error") {
      right = `<div class="err">Не ответил<button data-retry="${it.idx}">Повторить</button></div>`;
    } else {
      right = `<span class="sk" style="width:90px;margin-left:auto"></span><span class="sk" style="width:50px;margin:8px 0 0 auto"></span>`;
    }
    return `<div class="w">${avatar(it.address)}
      <div class="info"><div class="name">${esc(it.name)}</div>
      <button class="addr" data-copy="${it.address}" title="Скопировать адрес">${short(it.address)}${ico.copy}</button></div>
      <div class="val">${right}</div></div>`;
  }

  function draw() {
    if (!root || !root.isConnected) return;
    const ok = items.filter(i => i.status === "ok"), bad = items.filter(i => i.status === "error");
    const total = ok.reduce((s, i) => s + i.value, 0);
    const diff = ok.reduce((s, i) => s + (i.diff || 0), 0);
    const base = total - diff, pct = base > 0 ? diff / base * 100 : null;
    const cls = pct == null ? "flat" : pct >= 0 ? "up" : "down";
    $("#w-total", root).innerHTML = ok.length
      ? `<small>Общий баланс</small><div class="sum">${fmtUsd(total)}</div>
         <div class="row"><span class="${cls}">${pct == null ? "—" : (diff >= 0 ? "+" : "−") + fmtUsd(Math.abs(diff)).replace("-", "") + " · " + (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%"} за 24ч</span><span>Загружено ${ok.length} из ${items.length}</span></div>`
      : `<small>Общий баланс</small><div class="sum"><span class="sk" style="width:200px;height:34px"></span></div><div class="row"><span>Загружаем кошельки…</span></div>`;
    $("#w-banner", root).innerHTML = bad.length && !loading
      ? `<div class="banner">Не удалось загрузить кошельков: ${bad.length}. Остальные показаны, итог посчитан без них.</div>` : "";
    const rb = $("#w-refresh", root);
    rb.disabled = loading; rb.classList.toggle("spin", loading);
    $("#w-sort span", root).textContent = sortLabel();
    $("#w-upd", root).textContent = updated ? "Обновлено в " + updated.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
    $("#w-list", root).innerHTML = sorted().map(card).join("");
  }

  return {
    render(el) {
      root = el;
      el.innerHTML = `
        <div class="head"><h1>Wallets</h1></div>
        <div class="total" id="w-total"></div>
        <div id="w-banner"></div>
        <div class="bar">
          <button class="btn primary" id="w-refresh">${ico.refresh}<span>Обновить</span></button>
          <button class="btn" id="w-sort">${ico.sort}<span></span></button>
          <span class="upd" id="w-upd"></span>
        </div>
        <div class="list" id="w-list"></div>`;
      $("#w-refresh", el).onclick = refresh;
      $("#w-sort", el).onclick = () => { sort = { desc: "asc", asc: "none", none: "desc" }[sort]; draw(); };
      el.onclick = e => {
        const c = e.target.closest("[data-copy]"), r = e.target.closest("[data-retry]");
        if (c) navigator.clipboard?.writeText(c.dataset.copy).then(() => {
          const t = c.innerHTML; c.textContent = "Скопировано"; setTimeout(() => c.innerHTML = t, 900);
        });
        if (r) loadOne(items[+r.dataset.retry]).then(() => { updated = new Date(); paint(); });
      };
      draw();
      if (!updated && !loading) refresh();
    },
  };
})();

/* ============ Реестр модулей ============
   Чтобы добавить раздел: допишите объект в MODULES.
   render(container) — отрисовывает содержимое; без render показывается заглушка «Скоро». */
const MODULES = [
  { id: "wallets", title: "Wallets", icon: ico.wallet, render: el => Wallets.render(el) },
  { id: "stats", title: "Статистика", icon: ico.chart },
  { id: "protocols", title: "Протоколы", icon: ico.globe },
];

/* ============ Роутер ============ */
const nav = $("#nav"), view = $("#view");
nav.innerHTML = MODULES.map(m =>
  `<button data-id="${m.id}">${m.icon}<span>${esc(m.title)}</span>${m.render ? "" : '<em class="soon" style="font-style:normal">Скоро</em>'}</button>`).join("");
nav.onclick = e => { const b = e.target.closest("button"); if (b) location.hash = b.dataset.id; };

function route() {
  const m = MODULES.find(x => x.id === location.hash.slice(1)) || MODULES[0];
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.id === m.id));
  document.title = m.title + " · Dashboard";
  if (m.render) m.render(view);
  else view.innerHTML = `<div class="stub">${ico.clock}<h2>${esc(m.title)}</h2><p>Этот раздел скоро появится.</p></div>`;
}
addEventListener("hashchange", route);
route();
</script>
</body>
